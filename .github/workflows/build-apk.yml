name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push cancels any build still running for the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # ubuntu-24.04 ships with the Android SDK preinstalled.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Fetch Remote Play sources
        run: |
          # chiaki-ng is pinned as a submodule; only the native dependencies it needs are fetched.
          git submodule update --init --depth 1 third_party/chiaki-ng
          git -C third_party/chiaki-ng submodule update --init --depth 1 \
            third-party/nanopb third-party/jerasure third-party/gf-complete third-party/curl

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install protobuf tools
        run: |
          # nanopb's code generator needs protoc and the protobuf Python package.
          python -m pip install --quiet protobuf grpcio-tools
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec python -m grpc_tools.protoc "$@"\n' > "$HOME/bin/protoc"
          chmod +x "$HOME/bin/protoc"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Surface build errors
        if: failure()
        run: |
          # Kotlin compiler errors, failed tests and Gradle failure summaries become annotations.
          grep -E '^e: |FAILED$|Test.*FAILED|What went wrong|error:|CMake Error' -A2 build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line}"
          done

      - name: Collect APKs
        run: |
          mkdir dist
          VERSION=$(grep -oP 'versionName = "\K[^"$]+' app/build.gradle.kts)${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "dist/SubtitleTranslator-${VERSION}.apk"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: SubtitleTranslator-apk
          path: dist/*.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "dist/SubtitleTranslator-${VERSION}.apk" \
            --title "Subtitle Translator ${VERSION}" \
            --notes "Built from ${GITHUB_SHA::7}. Install \`SubtitleTranslator-${VERSION}.apk\` on your tablet." \
            --target "${GITHUB_SHA}" \
            --latest
